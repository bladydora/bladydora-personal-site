<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome to Bladydora's World</title>
    <script type="module" crossorigin src="./assets/index-W-_soSgW.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BvqbUc6P.css">
  </head>
  <body>
    <canvas id="world-canvas" aria-label="Bladydora 3D World"></canvas>

    <!-- 极简文艺电影感开场迷雾 -->
    <div id="mist-gate" class="mist-gate" role="dialog" aria-modal="true">
      <div class="mist-layer mist-layer-1"></div>
      <div class="mist-layer mist-layer-2"></div>
      <div class="mist-layer mist-layer-3"></div>
      <div class="mist-vignette"></div>
      <div class="mist-content">
        <div class="mist-welcome-kicker">Welcome to</div>
        <h1 class="mist-title">Bladydora’s World</h1>
        <div class="mist-hairline"></div>
        <button id="enter-world-btn" class="enter-btn" type="button">
          <span class="enter-btn-glow"></span>
          <span class="enter-btn-text">Enter</span>
        </button>
      </div>
    </div>

    <!-- 顶部极简导航 HUD -->
    <header class="hud-top">
      <div class="brand-pill">
        <span class="brand-dot"></span>
        <span class="brand-name">Bladydora</span>
      </div>

      <div class="hud-actions">
        <button id="toggle-audio-btn" class="hud-btn" type="button" title="氛围音开关">
          Sound: Off
        </button>
        <label class="hud-btn" for="spz-file-input" title="可选：导入 .spz 场景">
          .spz
        </label>
        <input id="spz-file-input" type="file" accept=".spz,.ply,.splat,.ksplat" hidden />
        <button id="toggle-coord-btn" class="hud-btn" type="button" title="快捷键 P：取坐标">
          P
        </button>
        <button id="toggle-fp-btn" class="hud-btn" type="button" title="切换第一人称鼠标锁定漫游 (F)">
          第一人称
        </button>
        <button id="toggle-index-btn" class="hud-btn hud-btn-primary" type="button">
          Index
        </button>
      </div>
    </header>

    <!-- 中心准星与悬停提示 -->
    <div id="reticle" class="reticle" aria-hidden="true">
      <div class="reticle-dot"></div>
      <div id="reticle-label" class="reticle-label"></div>
    </div>

    <!-- 底部极简提示与 ICP 备案（源码中恰好出现 1 次） -->
    <footer class="hud-bottom">
      <div class="controls-pill" id="controls-pill">
        <span><kbd>WASD</kbd> 漫游</span>
        <span>拖拽 / <kbd>F</kbd> 转向</span>
        <span class="progress-badge" id="discovery-progress">0 / 6</span>
      </div>
      <div class="icp-bar">
        <a
          class="icp-link"
          href="https://beian.miit.gov.cn/"
          target="_blank"
          rel="noopener noreferrer"
          >沪ICP备2026029287号-2</a
        >
      </div>
    </footer>

    <!-- 坐标助手浮窗 -->
    <aside id="coord-panel" class="coord-panel hidden">
      <div class="coord-header">
        <strong>COORDINATES</strong>
        <button id="close-coord-btn" class="icon-close" type="button" aria-label="关闭">×</button>
      </div>
      <div class="coord-readout" id="coord-readout">[0.00, 1.70, 0.00]</div>
      <button id="copy-coord-btn" class="hud-btn hud-btn-primary" type="button">Copy</button>
    </aside>

    <!-- 米山舞色散棱镜 × 暗调废墟诗意 · 节点艺术展签抽屉 -->
    <aside id="node-drawer" class="node-drawer hidden" role="dialog" aria-label="节点详情">
      <div class="prism-ambient"></div>
      <div class="corner-mark corner-tl"></div>
      <div class="corner-mark corner-br"></div>
      <div class="drawer-watermark" id="drawer-watermark">ARCHIVE</div>

      <div class="drawer-inner">
        <div class="drawer-header">
          <span id="drawer-badge" class="drawer-badge">01 · WORKS</span>
          <button id="close-drawer-btn" class="icon-close" type="button" aria-label="关闭">×</button>
        </div>
        <h2 id="drawer-title" class="drawer-title"></h2>
        <p id="drawer-subtitle" class="drawer-subtitle"></p>
        <div class="drawer-divider"></div>
        <p id="drawer-summary" class="drawer-summary"></p>
        <div id="drawer-items" class="drawer-items"></div>
      </div>
    </aside>

    <!-- 米山舞艺术画册风 · 花园目录弹层 -->
    <div id="index-modal" class="index-modal hidden" role="dialog" aria-modal="true" aria-label="花园目录">
      <div class="index-card">
        <div class="prism-ambient"></div>
        <div class="corner-mark corner-tl"></div>
        <div class="corner-mark corner-br"></div>
        <div class="index-header">
          <div>
            <div class="index-kicker">EXHIBITION INDEX · ARCHIVE</div>
            <h2>Bladydora’s World</h2>
          </div>
          <button id="close-index-btn" class="icon-close" type="button" aria-label="关闭">×</button>
        </div>
        <div class="drawer-divider"></div>
        <div id="index-grid" class="index-grid"></div>
      </div>
    </div>

    <!-- 拖拽 .spz 文件覆盖提示 -->
    <div id="drop-overlay" class="drop-overlay hidden">
      <div class="drop-box">
        <div class="drop-title">Drop .spz / .ply to enter</div>
      </div>
    </div>

    <!-- Toast 通知 -->
    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  </body>
</html>
